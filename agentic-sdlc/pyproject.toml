[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-sdlc"
version = "0.1.0"
description = "Agentic SDLC Orchestration System — generates a URL Shortener service as its target application."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "gitpython>=3.1",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "coverage[toml]>=7.4",
    "ruff>=0.4",
    "mypy>=1.9",
    "bandit>=1.7",
]
target = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
live = [
    "anthropic>=0.34",
]

[project.scripts]
agentic = "agentic.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["agentic"]
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest-tmp"

[tool.coverage.run]
source = ["src/agentic"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
